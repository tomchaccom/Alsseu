name: Verify

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: pnpm 설정
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: 린트·타입·테스트·빌드 검증
        run: pnpm verify
